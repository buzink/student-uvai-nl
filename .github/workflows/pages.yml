name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'   # every night at 04:00 UTC: fetch fresh content from student.uva.nl
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch content
        run: python3 generator/fetch.py --refresh
      - name: Build site
        run: python3 generator/build.py --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
